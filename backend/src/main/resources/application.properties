spring.application.name=college-finder

# PostgreSQL connection settings. Override these environment variables for each environment.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/college_finder}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway owns the schema; Hibernate validates the mapped schema once entities are introduced.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
